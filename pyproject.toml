[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-catalogue"
dynamic = ["version"]
description = "Cataloguing, tagging, previewing and exporting game assets"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "Pillow>=10",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.scripts]
asset-catalogue = "asset_catalogue.cli:main"
asset-catalogue-ui = "asset_catalogue.ui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "asset_catalogue.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
